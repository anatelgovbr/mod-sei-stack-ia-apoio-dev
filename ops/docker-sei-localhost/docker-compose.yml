# Nome fixo do projeto, diferente do nome da pasta: os volumes do banco e os containers
# ja criados nas maquinas da equipe usam este nome.
name: ops_sei-docker
# Portas so em 127.0.0.1: os servicos usam senhas de desenvolvimento e nao abrem para a rede.
services:
  jod:  
    image: ${DOCKER_REGISTRY}/${JOD_IMAGE}:${ENVIRONMENT_VERSION}
    container_name: jod

  smtp:
    image: ${DOCKER_REGISTRY}/mailcatcher:${ENVIRONMENT_VERSION}
    container_name: smtp
    ports:
      - "127.0.0.1:1080:1080"

  memcached:
    image: ${DOCKER_REGISTRY}/memcached:${ENVIRONMENT_VERSION}
    container_name: memcached
    ports:
      - "127.0.0.1:11211:11211"

  database:
    image: ${DOCKER_REGISTRY}/${DATABASE_IMAGE}:${ENVIRONMENT_VERSION}
    container_name: ${DATABASE_HOST}
    restart: always
    volumes:
      - ${DATABASE_HOST}:${DATABASE_DATA_DIR}
    ports:
      - 127.0.0.1:${DATABASE_PORT}:${DATABASE_PORT}
    # A porta so abre quando o banco aceita conexao. Sem espaco no comando: o Podman 4.9 quebra o
    # argumento nos espacos, e o bash rodaria so o echo, que sempre passa.
    healthcheck:
      test: ["CMD", "bash", "-c", "echo>/dev/tcp/127.0.0.1/${DATABASE_PORT}"]
      interval: 5s
      retries: 60

  solr:
    image: ${DOCKER_REGISTRY}/${SOLR_IMAGE}:${ENVIRONMENT_VERSION}
    container_name: solr
    ports:
      - "127.0.0.1:8983:8983"

  httpd:
    build:
      context: .
      args:
        BASE_IMAGE: ${DOCKER_REGISTRY}/${APP_IMAGE}:${ENVIRONMENT_VERSION}
    container_name: httpd
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
      memcached:
        condition: service_started
      solr:
        condition: service_started
      smtp:
        condition: service_started
      jod:
        condition: service_started
    # O Apache so abre a porta no fim do /command.sh, com o SEI pronto. Sem curl: o XDEBUG_SESSION do
    # ambiente faria o PHP abrir uma sessao no depurador a cada checagem.
    healthcheck:
      test: ["CMD", "bash", "-c", "echo>/dev/tcp/127.0.0.1/8000"]
      interval: 5s
      retries: 60
    command: ["bash", "/iniciar-httpd.sh"]
    volumes:
      - ${SEI_PATH}:/opt/
      - ./iniciar-httpd.sh:/iniciar-httpd.sh:ro
    environment:
      - XDEBUG_CONFIG="idekey=default client_host=${HOST_IP} client_port=9003 discover_client_host=1"
      - XDEBUG_SESSION=default
      - XDEBUG_MODE=debug
      - HOST_URL=http://localhost:8000
      - DATABASE_TYPE=${DATABASE_TYPE}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}

      - SEI_CHAVE_ACESSO=${SEI_CHAVE_ACESSO}
      - SEI_DATABASE_NAME=${SEI_DATABASE_NAME}
      - SEI_DATABASE_USER=${SEI_DATABASE_USER}
      - SEI_DATABASE_PASSWORD=${SEI_DATABASE_PASSWORD}
      - SEI_DATABASE_USER_SCRIPT=${SEI_DATABASE_USER_SCRIPT}
      - SEI_DATABASE_PASSWORD_SCRIPT=${SEI_DATABASE_PASSWORD_SCRIPT}

      - SIP_CHAVE_ACESSO=${SIP_CHAVE_ACESSO}
      - SIP_DATABASE_NAME=${SIP_DATABASE_NAME}
      - SIP_DATABASE_USER=${SIP_DATABASE_USER}
      - SIP_DATABASE_PASSWORD=${SIP_DATABASE_PASSWORD}
      - SIP_DATABASE_USER_SCRIPT=${SIP_DATABASE_USER_SCRIPT}
      - SIP_DATABASE_PASSWORD_SCRIPT=${SIP_DATABASE_PASSWORD_SCRIPT}


volumes:
  mysql:
  oracle:
  sqlserver:
  postgres: