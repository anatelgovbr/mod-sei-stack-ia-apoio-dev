# Analise local do SEI no SonarQube de localhost:9000.
# Os arquivos alterados (sonar.sources) e a versao (sonar.projectVersion, SHA curto do commit) entram pelo sonar/enviar.sh.
sonar.projectKey=sei-local
sonar.projectName=SEI local

# O codigo vem da copia no disco Linux do container qa (volume sei-qa-src, em /src), os mesmos
# caminhos que o PHPStan e o Psalm gravam nos relatorios. Sem isso as issues externas sao descartadas.
sonar.projectBaseDir=/src
sonar.working.directory=/tmp/scannerwork

# O fonte do SEI e ISO-8859-1.
sonar.sourceEncoding=ISO-8859-1

# Igual ao servidor da Anatel.
sonar.php.exclusions=**/vendor/**

# Relatorios do PHPStan e do Psalm, ja filtrados para as linhas alteradas.
# O Psalm precisa estar no formato sonarqube: com o JSON comum, o SonarPHP nao importa nada.
sonar.php.phpstan.reportPaths=/relatorios/phpstan.json
sonar.php.psalm.reportPaths=/relatorios/psalm.json

# Espera o resultado do Quality Gate para mostrar no terminal.
sonar.qualitygate.timeout=300

# /src nao e um repositorio git.
sonar.scm.disabled=true
